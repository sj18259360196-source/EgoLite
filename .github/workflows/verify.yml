name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: CoS and browser controller tests
        run: node --test --test-concurrency=1 "apps/desktop-shell/workspace-packs/*.test.mjs" apps/desktop-shell/desktop-browser-controller.test.mjs apps/desktop-shell/scansci-service.test.mjs apps/desktop-shell/public/scansci-navigation.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv==0.11.30
      - run: uv venv integrations/scansci/.venv --python 3.14
      - run: uv pip sync integrations/scansci/requirements.lock --python integrations/scansci/.venv/Scripts/python.exe
      - run: node tools/prepare-scansci-source.mjs
      - name: ScanSci adapter tests
        env:
          PYTHONPATH: ${{ github.workspace }}/integrations/scansci/runtime/src
          SCANSCI_PDF_DATA_DIR: ${{ github.workspace }}/.tmp/codex/scansci-ci/data
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          New-Item -ItemType Directory -Path .tmp/codex/scansci-ci -ErrorAction SilentlyContinue
          integrations/scansci/.venv/Scripts/python.exe -m pytest integrations/scansci/test_host.py --basetemp=.tmp/codex/scansci-ci/pytest -p no:cacheprovider -q
