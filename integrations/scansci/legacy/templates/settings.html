<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScanSci PDF 状态与设置</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --surface: #ffffff;
            --surface-2: #f8fafb;
            --line: #dbe1e7;
            --line-strong: #c5ced7;
            --text: #18212a;
            --muted: #63707d;
            --blue: #2463eb;
            --blue-soft: #eaf0ff;
            --green: #16845b;
            --green-soft: #e8f6ef;
            --amber: #a36312;
            --amber-soft: #fff4dd;
            --red: #c23b3b;
            --red-soft: #fff0f0;
            --nav: #202a33;
            --nav-muted: #aeb8c2;
            --radius: 6px;
            font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); letter-spacing: 0; }
        button, input, select { font: inherit; letter-spacing: 0; }
        button { cursor: pointer; }
        button:disabled { cursor: wait; opacity: .55; }
        .app { min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); }
        .sidebar { background: var(--nav); color: #fff; padding: 22px 14px; display: flex; flex-direction: column; gap: 24px; }
        .brand { padding: 0 10px; }
        .brand strong { display: block; font-size: 18px; font-weight: 700; }
        .brand span { display: block; margin-top: 5px; color: var(--nav-muted); font-size: 12px; }
        .nav { display: grid; gap: 4px; }
        .nav button, .nav a { width: 100%; min-height: 38px; border: 0; color: var(--nav-muted); background: transparent; text-align: left; padding: 0 11px; border-radius: 5px; text-decoration: none; display: flex; align-items: center; gap: 9px; }
        .nav button:hover, .nav a:hover { background: #2b3741; color: #fff; }
        .nav button.active { background: #34424e; color: #fff; }
        .nav-icon { width: 18px; text-align: center; font-size: 16px; }
        .sidebar-foot { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid #394650; color: var(--nav-muted); font-size: 11px; line-height: 1.6; }
        .main { min-width: 0; }
        .topbar { min-height: 68px; background: var(--surface); border-bottom: 1px solid var(--line); padding: 0 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; position: sticky; top: 0; z-index: 10; }
        .topbar h1 { margin: 0; font-size: 19px; font-weight: 680; }
        .topbar p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
        .toolbar { display: flex; align-items: center; gap: 8px; }
        .btn { min-height: 34px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: var(--text); padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; white-space: nowrap; }
        .btn:hover { border-color: #9eabb7; background: var(--surface-2); }
        .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
        .btn.primary:hover { background: #1d54ce; }
        .btn.danger { color: var(--red); }
        .content { width: min(1180px, 100%); padding: 24px 28px 50px; }
        .view[hidden] { display: none; }
        .summary { display: grid; grid-template-columns: minmax(240px, 1.35fr) repeat(3, minmax(130px, .65fr)); border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
        .summary-main, .metric { min-height: 112px; padding: 20px; }
        .metric { border-left: 1px solid var(--line); }
        .summary-label, .metric-label { color: var(--muted); font-size: 12px; }
        .summary-title { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 21px; font-weight: 680; }
        .summary-note { margin-top: 8px; color: var(--muted); font-size: 12px; }
        .metric-value { margin-top: 12px; font-size: 22px; font-weight: 680; }
        .metric-note { margin-top: 7px; color: var(--muted); font-size: 11px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #a5afb8; flex: 0 0 auto; }
        .dot.ok { background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
        .dot.warn { background: #d18a24; box-shadow: 0 0 0 4px var(--amber-soft); }
        .dot.off { background: #8d99a5; }
        .section { margin-top: 24px; }
        .section-head { min-height: 38px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .section-head h2 { margin: 0; font-size: 14px; font-weight: 700; }
        .section-head span { color: var(--muted); font-size: 12px; }
        .channel-list { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
        .channel { display: grid; grid-template-columns: 190px minmax(220px, 1fr) minmax(220px, .85fr) auto; gap: 18px; align-items: center; min-height: 84px; padding: 15px 17px; border-top: 1px solid var(--line); }
        .channel:first-child { border-top: 0; }
        .channel-name { display: flex; align-items: center; gap: 11px; min-width: 0; }
        .channel-name strong { display: block; font-size: 13px; }
        .channel-name span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
        .channel-state { font-size: 13px; font-weight: 620; }
        .channel-state small { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; font-weight: 400; line-height: 1.45; }
        .channel-config { color: var(--muted); font-size: 11px; line-height: 1.55; word-break: break-word; }
        .channel-actions { display: flex; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
        .pill { display: inline-flex; align-items: center; min-height: 22px; padding: 0 7px; border-radius: 999px; background: #edf1f4; color: #55616c; font-size: 11px; }
        .pill.good { background: var(--green-soft); color: var(--green); }
        .pill.warn { background: var(--amber-soft); color: var(--amber); }
        .pill.blue { background: var(--blue-soft); color: var(--blue); }
        .route { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); }
        .route b { font-size: 12px; margin-right: 5px; }
        .arrow { color: #98a3ad; }
        .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
        .settings-group { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); overflow: hidden; }
        .settings-group h2 { margin: 0; padding: 15px 17px; border-bottom: 1px solid var(--line); font-size: 14px; }
        .field { display: grid; grid-template-columns: minmax(130px, .8fr) minmax(180px, 1.2fr); gap: 15px; align-items: center; min-height: 64px; padding: 11px 17px; border-top: 1px solid #edf0f2; }
        .field:first-of-type { border-top: 0; }
        .field label { font-size: 12px; font-weight: 620; }
        .field label small { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 400; line-height: 1.45; }
        .control { display: flex; align-items: center; gap: 7px; min-width: 0; }
        input, select { width: 100%; min-height: 34px; border: 1px solid var(--line-strong); border-radius: 5px; background: #fff; color: var(--text); padding: 6px 9px; outline: none; font-size: 12px; }
        input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
        .toggle { width: 38px; height: 22px; padding: 2px; border: 0; border-radius: 999px; background: #b9c2ca; flex: 0 0 auto; }
        .toggle::after { content: ""; display: block; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .16s ease; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
        .toggle.on { background: var(--blue); }
        .toggle.on::after { transform: translateX(16px); }
        .diagnostic { border: 1px solid var(--line); background: #111921; color: #d6dee6; border-radius: var(--radius); padding: 16px; min-height: 240px; max-height: 520px; overflow: auto; white-space: pre-wrap; font: 12px/1.65 Consolas, monospace; }
        .toast { position: fixed; right: 22px; bottom: 22px; width: min(390px, calc(100vw - 44px)); padding: 13px 15px; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: var(--radius); background: var(--surface); box-shadow: 0 12px 34px rgba(34,45,55,.16); font-size: 12px; z-index: 30; }
        .toast.error { border-left-color: var(--red); }
        .busy { animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: .52; } }
        @media (max-width: 960px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { padding: 12px 14px; flex-direction: row; align-items: center; gap: 12px; overflow-x: auto; }
            .brand span, .sidebar-foot { display: none; }
            .nav { display: flex; }
            .nav button, .nav a { width: auto; white-space: nowrap; }
            .topbar { top: 62px; }
            .summary { grid-template-columns: repeat(3, 1fr); }
            .summary-main { grid-column: 1 / -1; border-bottom: 1px solid var(--line); }
            .channel { grid-template-columns: 165px 1fr auto; }
            .channel-config { display: none; }
        }
        @media (max-width: 680px) {
            .topbar { padding: 12px 16px; align-items: flex-start; }
            .content { padding: 18px 14px 36px; }
            .summary { grid-template-columns: 1fr; }
            .summary-main, .metric { min-height: 88px; border-left: 0; border-top: 1px solid var(--line); }
            .summary-main { border-top: 0; }
            .channel { grid-template-columns: 1fr; gap: 9px; }
            .channel-actions { justify-content: flex-start; }
            .settings-grid { grid-template-columns: 1fr; }
            .field { grid-template-columns: 1fr; gap: 8px; }
            .toolbar .btn span { display: none; }
        }
    </style>
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand"><strong>ScanSci PDF</strong><span>本地文献通道控制台</span></div>
        <nav class="nav" aria-label="页面导航">
            <button class="active" data-view="status"><span class="nav-icon">●</span>状态详情</button>
            <button data-view="settings"><span class="nav-icon">⚙</span>设置</button>
            <button data-view="diagnostics"><span class="nav-icon">⌁</span>诊断结果</button>
            <a href="/"><span class="nav-icon">⌕</span>论文检索</a>
        </nav>
        <div class="sidebar-foot">浏览器固定使用 EgoLite<br>灰色源与 Tor 默认关闭</div>
    </aside>

    <div class="main">
        <header class="topbar">
            <div><h1 id="pageTitle">状态详情</h1><p id="checkedAt">正在读取本机配置</p></div>
            <div class="toolbar">
                <button class="btn" id="refreshBtn" title="刷新全部状态"><b>↻</b><span>刷新</span></button>
                <button class="btn primary" data-open-settings title="打开设置"><b>⚙</b><span>设置</span></button>
            </div>
        </header>

        <main class="content">
            <section class="view" id="statusView">
                <div class="summary">
                    <div class="summary-main">
                        <div class="summary-label">整体状态</div>
                        <div class="summary-title"><span class="dot" id="overallDot"></span><span id="overallText">检查中</span></div>
                        <div class="summary-note" id="overallNote">正在连接 EgoLite 与本地服务</div>
                    </div>
                    <div class="metric"><div class="metric-label">浏览器</div><div class="metric-value" id="browserMetric">...</div><div class="metric-note">EgoLite 原生桥接</div></div>
                    <div class="metric"><div class="metric-label">机构通道</div><div class="metric-value" id="institutionMetric">...</div><div class="metric-note">ECNU WebVPN 优先</div></div>
                    <div class="metric"><div class="metric-label">灰色源</div><div class="metric-value" id="greyMetric">...</div><div class="metric-note">需显式开启</div></div>
                </div>

                <div class="section">
                    <div class="section-head"><h2>下载顺序</h2><span>当前调度策略</span></div>
                    <div class="route" id="route"></div>
                </div>

                <div class="section">
                    <div class="section-head"><h2>下载通道</h2><span>检查、登录与启停都在这里完成</span></div>
                    <div class="channel-list" id="channelList"></div>
                </div>
            </section>

            <section class="view" id="settingsView" hidden>
                <div class="settings-grid" id="settingsGrid"></div>
            </section>

            <section class="view" id="diagnosticsView" hidden>
                <div class="section-head"><h2>最近一次操作结果</h2><span>不会显示 Cookie 内容</span></div>
                <pre class="diagnostic" id="diagnosticOutput">尚未运行诊断。</pre>
            </section>
        </main>
    </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const state = { data: null, busy: new Set(), view: 'status' };
const $ = (selector) => document.querySelector(selector);
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const channelMeta = {
    egolite: { name: 'EgoLite', sub: '唯一浏览器后端' },
    webvpn: { name: 'ECNU WebVPN', sub: '学校机构授权主通道' },
    elsevier: { name: 'Elsevier API', sub: 'ScienceDirect 批量快速通道' },
    oa: { name: '开放获取', sub: 'Unpaywall、OpenAlex、CORE 等' },
    carsi: { name: 'CARSI', sub: '出版社联合身份认证' },
    ezproxy: { name: '图书馆代理', sub: 'EZproxy（学校提供时使用）' },
    grey: { name: '灰色源', sub: 'Sci-Hub、LibGen、SciBban' },
    tor: { name: 'Tor', sub: '仅供显式启用的灰色源' },
};

function channelStatus(key, item) {
    if (key === 'egolite') return item.available
        ? ['ok', '在线', item.strict_egolite ? '严格 EgoLite 模式' : '存在外部浏览器回退']
        : ['off', '离线', '刷新会尝试自动唤醒'];
    if (key === 'webvpn') return item.session_valid ? ['ok', '已登录', item.vpnsci_school || 'East China Normal University'] : item.vpnsci_enabled ? ['warn', '需要检查', '已配置，当前会话未确认'] : ['off', '未启用', '可在设置中开启'];
    if (key === 'elsevier') return item.status === 'configured' ? ['ok', 'Key 已配置', item.test ? `验证 ${item.test}` : '可单独测试 API'] : ['warn', '未配置', '付费全文将转机构通道'];
    if (key === 'oa') return item.configured ? ['ok', '已配置', '可运行实时网络检查'] : ['warn', '邮箱待配置', 'Unpaywall 需要有效邮箱'];
    if (key === 'carsi') return item.carsi_enabled ? ['warn', '已启用', item.carsi_idp_name || '学校名称待设置'] : ['off', '未启用', '当前由 WebVPN 承担机构访问'];
    if (key === 'ezproxy') {
        if (item.configuration_state === 'not_applicable') return ['off', '本校不适用', 'ECNU 官方使用 WebVPN、CARSI 或 VPN'];
        if (item.session_valid) return ['ok', '会话有效', item.ezproxy_login_url || 'EZproxy'];
        if (item.configuration_state === 'needs_configuration') return ['off', '需要配置', '请填写图书馆提供的 EZproxy 官方入口'];
        return item.ezproxy_enabled ? ['warn', '已启用', '当前会话未确认'] : ['off', '已配置但关闭', '启用后可登录'];
    }
    if (key === 'grey') {
        const enabled = Object.entries(item.sources || {}).filter(([, value]) => value).map(([name]) => name);
        return enabled.length ? ['warn', '已显式开启', enabled.join(' / ')] : ['off', '默认关闭', '不会探测或访问'];
    }
    if (key === 'tor') {
        if (item.running) return ['warn', '正在运行', item.enabled_for_grey ? '灰色源允许使用 Tor' : '当前未绑定下载'];
        if (item.enabled_for_grey) return ['warn', '已开启，未运行', '下载可使用 Tor，但当前没有可用回路'];
        return ['off', '默认关闭', '仅在显式开启后使用'];
    }
    return ['off', '未知', ''];
}

function actionsFor(key, item) {
    const check = `<button class="btn" data-action="check" data-channel="${key}">检查</button>`;
    if (key === 'egolite') return check;
    if (key === 'webvpn') return `${check}<button class="btn" data-action="test" data-channel="webvpn">测试</button><button class="btn primary" data-action="login" data-channel="webvpn">登录</button>`;
    if (key === 'elsevier') return `<button class="btn" data-action="test" data-channel="elsevier">测试 API</button>`;
    if (key === 'oa') return `<button class="btn" data-action="check" data-channel="oa">网络检查</button>`;
    if (key === 'carsi') return `${check}<button class="btn" data-action="login" data-channel="carsi">登录</button>`;
    if (key === 'ezproxy') {
        if (item.configuration_state === 'not_applicable') return `${check}<button class="btn" data-focus-channel="webvpn">查看主通道</button>`;
        if (!item.ezproxy_enabled || !item.ezproxy_login_url) return `${check}<button class="btn" data-configure="ezproxy_login_url">配置</button>`;
        return `${check}<button class="btn" data-action="login" data-channel="ezproxy">登录</button>`;
    }
    if (key === 'grey') return '<button class="btn" data-view="settings">管理开关</button>';
    if (key === 'tor') return item.running ? `<button class="btn danger" data-action="stop" data-channel="tor">停止</button>` : `<button class="btn" data-action="install" data-channel="tor">安装</button><button class="btn primary" data-action="start" data-channel="tor">启动</button>`;
    return check;
}

function channelConfig(key, item) {
    if (key === 'egolite') return `${esc(item.backend)}<br>${esc(item.binary)}`;
    if (key === 'webvpn') return `${esc(item.vpnsci_school || '未设置学校')}<br>${esc(item.vpnsci_base_url || '')}`;
    if (key === 'elsevier') return item.status === 'configured' ? 'API Key 已保存<br>完整值不在页面显示' : '未保存 API Key';
    if (key === 'oa') return `Unpaywall 邮箱<br>${esc(item.email || '未配置')}`;
    if (key === 'carsi') return esc(item.carsi_idp_name || '未设置 IdP');
    if (key === 'ezproxy') {
        if (item.configuration_state === 'not_applicable') return `ECNU 官方通道<br>${esc((item.official_access_methods || []).join(' / '))}`;
        return esc(item.ezproxy_login_url || '未设置地址');
    }
    if (key === 'grey') {
        const enabled = Object.entries(item.sources || {}).filter(([, value]) => value).map(([name]) => name);
        return `<span class="pill ${enabled.length ? 'warn' : ''}">${enabled.length ? esc(enabled.join(' / ')) : '全部禁止调用'}</span>`;
    }
    if (key === 'tor') return `<span class="pill ${item.enabled_for_grey ? 'warn' : ''}">${item.enabled_for_grey ? '自动回退已开' : '自动回退已关'}</span>`;
    return '';
}

function renderStatus() {
    const channels = state.data.channels;
    const browserOk = !!channels.egolite.available;
    const webvpnOk = !!channels.webvpn.session_valid;
    const configuredCount = ['webvpn','elsevier','oa','carsi','ezproxy'].filter(k => ['ok','warn'].includes(channelStatus(k, channels[k])[0])).length;
    $('#overallDot').className = `dot ${browserOk && webvpnOk ? 'ok' : 'warn'}`;
    $('#overallText').textContent = browserOk && webvpnOk ? '核心通道可用' : '部分通道需要处理';
    $('#overallNote').textContent = browserOk ? 'EgoLite 已连接，下载按合法来源与机构授权优先执行' : 'EgoLite 当前不可达，刷新会尝试自动唤醒';
    $('#browserMetric').textContent = browserOk ? '在线' : '离线';
    $('#institutionMetric').textContent = `${configuredCount} 项`;
    $('#greyMetric').textContent = channels.grey.enabled ? '已开启' : '关闭';
    const routeLabels = { cache:'本地缓存', open_access:'开放获取', elsevier_api:'Elsevier API', institution:'ECNU / 机构', grey_opt_in:'灰色源（显式）' };
    $('#route').innerHTML = `<b>${esc(state.data.settings.download_strategy || 'oa_first')}</b>` + state.data.priority.map((key, i) => `${i ? '<span class="arrow">→</span>' : ''}<span class="pill ${key === 'institution' ? 'blue' : key === 'grey_opt_in' ? 'warn' : 'good'}">${routeLabels[key]}</span>`).join('');
    const order = ['egolite','webvpn','elsevier','oa','carsi','ezproxy','grey','tor'];
    $('#channelList').innerHTML = order.map(key => {
        const item = channels[key] || {};
        const [kind, label, note] = channelStatus(key, item);
        const busy = state.busy.has(key) ? ' busy' : '';
        return `<div class="channel${busy}" data-channel-row="${key}">
            <div class="channel-name"><span class="dot ${kind}"></span><div><strong>${channelMeta[key].name}</strong><span>${channelMeta[key].sub}</span></div></div>
            <div class="channel-state">${label}<small>${esc(note)}</small></div>
            <div class="channel-config">${channelConfig(key, item)}</div>
            <div class="channel-actions">${actionsFor(key, item)}</div>
        </div>`;
    }).join('');
}

const groups = [
    ['下载策略', [
        ['download_strategy','默认策略','OA 与机构优先顺序','select',['oa_first','legal_only','fastest','scihub_first','scihub_only','grey_only']],
        ['output_dir','下载目录','PDF 默认保存位置','text'],
        ['batch_workers','批量并发','建议 4 到 10','number'],
        ['download_si','自动下载附件','补充材料默认关闭','toggle'],
    ]],
    ['EgoLite', [
        ['browser_backend','浏览器后端','本机固定为 EgoLite','select',['egolite']],
        ['egolite_auto_start','离线自动唤醒','EgoLite 不在线时启动','toggle'],
        ['egolite_task_space','任务空间','浏览器共享工作区名称','text'],
        ['auto_relogin','会话自动恢复','机构 Cookie 过期时重新登录','toggle'],
    ]],
    ['ECNU 与机构访问', [
        ['vpnsci_enabled','启用 WebVPN','当前主机构通道','toggle'],
        ['vpnsci_school','学校名称','East China Normal University','text'],
        ['vpnsci_base_url','WebVPN 地址','ECNU 代理入口','text'],
        ['carsi_enabled','启用 CARSI','出版社联合认证','toggle'],
        ['carsi_idp_name','CARSI 学校','建议填写英文机构名','text'],
        ['ezproxy_enabled','启用 EZproxy','仅在学校明确提供时开启','toggle'],
        ['ezproxy_login_url','EZproxy 地址','ECNU 不提供此入口，保持为空','text'],
    ]],
    ['API 与开放获取', [
        ['email','Unpaywall 邮箱','用于开放获取查询','email'],
        ['elsevier_api_key','Elsevier API Key','留空不会覆盖现有 Key','password'],
        ['connect_timeout','连接超时','单位为秒','number'],
        ['read_timeout','读取超时','单位为秒','number'],
    ]],
    ['灰色源与 Tor', [
        ['scihub_enabled','Sci-Hub','默认关闭，任务启动前读取当前值','toggle'],
        ['libgen_enabled','LibGen','默认关闭，独立授权','toggle'],
        ['scibban_enabled','SciBban','默认关闭，独立授权','toggle'],
        ['use_tor_for_scihub','Tor 自动回退','仅在灰色源开启后生效','toggle'],
        ['tor_use_bridges','Tor 网桥','受限网络下使用','toggle'],
    ]],
];

function renderSettings() {
    const values = state.data.settings;
    $('#settingsGrid').innerHTML = groups.map(([title, fields]) => `<section class="settings-group"><h2>${title}</h2>${fields.map(([key,label,note,type,options]) => {
        const value = key === 'elsevier_api_key' ? '' : values[key];
        let control = '';
        if (type === 'toggle') control = `<button class="toggle ${value ? 'on' : ''}" data-toggle="${key}" data-value="${!value}" aria-label="${label}"></button><span class="pill ${value ? 'blue' : ''}">${value ? '已开启' : '已关闭'}</span>`;
        else if (type === 'select') control = `<select data-setting="${key}">${options.map(v => `<option value="${v}" ${String(value) === v ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn" data-save="${key}">保存</button>`;
        else control = `<input data-setting="${key}" type="${type}" value="${esc(value ?? '')}" placeholder="${key === 'elsevier_api_key' && state.data.secrets.elsevier_api_key_configured ? '已配置，输入新值可替换' : ''}"><button class="btn" data-save="${key}">保存</button>`;
        return `<div class="field"><label>${label}<small>${note}</small></label><div class="control">${control}</div></div>`;
    }).join('')}</section>`).join('');
}

function showToast(message, error=false) {
    const el = $('#toast');
    el.textContent = message;
    el.className = `toast${error ? ' error' : ''}`;
    el.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => el.hidden = true, 3600);
}

function showDiagnostic(title, result) {
    $('#diagnosticOutput').textContent = `${title}\n\n${JSON.stringify(result, null, 2)}`;
}

async function loadDashboard(quiet=false) {
    $('#refreshBtn').disabled = true;
    try {
        const resp = await fetch('/api/dashboard');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        state.data = await resp.json();
        $('#checkedAt').textContent = `最后刷新 ${new Date(state.data.checked_at).toLocaleString()}`;
        renderStatus();
        renderSettings();
        if (!quiet) showToast('状态已刷新');
    } catch (error) {
        showToast(`刷新失败 ${error.message}`, true);
    } finally {
        $('#refreshBtn').disabled = false;
    }
}

async function saveSetting(key, value) {
    try {
        const resp = await fetch('/api/config', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key, value:String(value)})});
        const result = await resp.json();
        showDiagnostic(`设置 ${key}`, result);
        if (!resp.ok || result.success === false) throw new Error(result.error || '保存失败');
        showToast(`${key} 已保存`);
        await loadDashboard(true);
    } catch (error) { showToast(error.message, true); }
}

async function channelAction(channel, action) {
    state.busy.add(channel); renderStatus();
    try {
        const resp = await fetch('/api/channel/action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({channel, action})});
        const result = await resp.json();
        showDiagnostic(`${channel} ${action}`, result);
        if (result.error_type === 'needs_configuration') {
            openSetting('ezproxy_login_url');
            throw new Error(result.error || '请先完成配置');
        }
        if (result.error_type === 'not_applicable') {
            focusChannel('webvpn');
            throw new Error(result.error || '当前学校不使用此通道');
        }
        if (!resp.ok || result.success === false) throw new Error(result.error || '操作失败');
        showToast(`${channel} ${action} 已完成`);
        await loadDashboard(true);
    } catch (error) { showToast(error.message, true); }
    finally { state.busy.delete(channel); if (state.data) renderStatus(); }
}

function openSetting(key) {
    switchView('settings');
    requestAnimationFrame(() => {
        const input = document.querySelector(`[data-setting="${key}"]`);
        input?.scrollIntoView({block:'center'});
        input?.focus();
    });
}

function focusChannel(channel) {
    switchView('status');
    requestAnimationFrame(() => {
        document.querySelector(`[data-channel-row="${channel}"]`)?.scrollIntoView({block:'center'});
    });
}

function switchView(view) {
    state.view = view;
    document.querySelectorAll('.view').forEach(el => el.hidden = el.id !== `${view}View`);
    document.querySelectorAll('[data-view]').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    $('#pageTitle').textContent = ({status:'状态详情',settings:'设置',diagnostics:'诊断结果'})[view];
}

document.addEventListener('click', (event) => {
    const nav = event.target.closest('[data-view]');
    if (nav) switchView(nav.dataset.view);
    if (event.target.closest('[data-open-settings]')) switchView('settings');
    const action = event.target.closest('[data-action]');
    if (action) channelAction(action.dataset.channel, action.dataset.action);
    const configure = event.target.closest('[data-configure]');
    if (configure) openSetting(configure.dataset.configure);
    const focus = event.target.closest('[data-focus-channel]');
    if (focus) focusChannel(focus.dataset.focusChannel);
    const toggle = event.target.closest('[data-toggle]');
    if (toggle) saveSetting(toggle.dataset.toggle, toggle.dataset.value);
    const save = event.target.closest('[data-save]');
    if (save) {
        const input = document.querySelector(`[data-setting="${save.dataset.save}"]`);
        saveSetting(save.dataset.save, input.value);
    }
});
$('#refreshBtn').addEventListener('click', () => loadDashboard());
loadDashboard(true);
</script>
</body>
</html>
