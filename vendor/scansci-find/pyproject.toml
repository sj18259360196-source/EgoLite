[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scansci-find"
version = "0.4.0+egolite.1"
description = "Domain-neutral, auditable multi-source academic discovery for ScanSci."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ScanSci contributors" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
cdp = ["websocket-client>=1.7"]

[project.scripts]
scansci-find = "scansci_find.cli:main"
scansci-browser = "scansci_find.browser_discovery:main"
scansci-find-mcp = "scansci_find.mcp_server:main"

[tool.setuptools]
packages = ["scansci_find"]
